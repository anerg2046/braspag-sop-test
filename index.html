<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Braspag Silent Order Post</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    padding: 30px;
}
.form {
    max-width: 400px;
    background: #fff;
    padding: 20px;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
}
input, button {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    font-size: 14px;
}
button {
    background: #007bff;
    color: #fff;
    border: none;
    cursor: pointer;
}
pre {
    background: #111;
    color: #0f0;
    padding: 10px;
}
</style>

<!-- ✅ 官方 SOP JS（必须） -->
<script src="https://www.pagador.com.br/post/scripts/silentorderpost-1.0.min.js"></script>
</head>

<body>

<div class="form">
    <h2>Credit Card</h2>

    <!-- ⚠️ class 名必须和 SOP 要求的一致 -->
    <input class="bp-sop-cardholdername" value="JOHN DOE" placeholder="Holder Name">
    <input class="bp-sop-cardnumber" value="4111111111111111" placeholder="Card Number">
    <input class="bp-sop-cardexpirationdate" value="12/2030" placeholder="MM/YYYY">
    <input class="bp-sop-cardcvv" value="123" placeholder="CVV">

    <input class="bp-sop-cardAlias" placeholder="Alias (optional)">
    <input type="hidden" class="bp-sop-cardtype" value="CreditCard">

    <button onclick="submitCard()">Submit</button>
</div>

<h3>Result</h3>
<pre id="result">Waiting...</pre>

<script>
function submitCard() {
    document.getElementById("result").innerText = "Sending...";

    bpSop_silentOrderPost({
        environment: "production",     // sandbox | production
        provider: "braspag",        // braspag | cielo
        language: "EN",

        // 🔴 必须由后端生成（sandbox token）
        accessToken: "NGI5NWU1MzgtMDI2Ny00NmNkLWFjZmEtMDRiNWI0MTZjYTg2MTgzNDY4ODIyNQ==",

        enableTokenize: true,
        enableBinQuery: true,
        enableVerifyCard: false,

        onSuccess: function (response) {
            document.getElementById("result").innerText =
                "SUCCESS:\n" + JSON.stringify(response, null, 2);
        },

        onError: function (error) {
            document.getElementById("result").innerText =
                "ERROR:\n" + JSON.stringify(error, null, 2);
        },

        onInvalid: function (errors) {
            document.getElementById("result").innerText =
                "INVALID:\n" + JSON.stringify(errors, null, 2);
        }
    });
}
</script>

</body>
</html>
