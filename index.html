<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Braspag Silent Order Post (Form)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    padding: 30px;
}
.card-form {
    max-width: 420px;
    background: #fff;
    padding: 20px;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
}
.card-form h2 {
    margin-top: 0;
}
.card-form input, .card-form button {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    font-size: 14px;
}
.card-form button {
    background: #007bff;
    color: #fff;
    border: none;
    cursor: pointer;
}
pre {
    margin-top: 20px;
    background: #111;
    color: #0f0;
    padding: 10px;
}
iframe {
    display: none;
}
</style>
</head>

<body>

<div class="card-form">
    <h2>Credit Card (SOP)</h2>

    <!-- ⚠️ target 必须是 iframe -->
    <form
        id="sopForm"
        method="POST"
        target="bp_iframe"
        action="https://transactionsandbox.pagador.com.br/post/api/public/v1/card">

        <input name="HolderName" placeholder="Card Holder Name" value="JOHN DOE" required>
        <input name="RawNumber" placeholder="Card Number" value="4111111111111111" required>
        <input name="Expiration" placeholder="MM/YYYY" value="12/2030" required>
        <input name="SecurityCode" placeholder="CVV" value="123">

        <!-- 必填 -->
        <input type="hidden" name="AccessToken" value="PUT_YOUR_SANDBOX_ACCESS_TOKEN">

        <!-- 可选参数 -->
        <input type="hidden" name="EnableTokenize" value="true">
        <input type="hidden" name="EnableBinQuery" value="true">
        <input type="hidden" name="CardType" value="CreditCard">

        <button type="submit">Submit</button>
    </form>
</div>

<iframe name="bp_iframe"></iframe>

<h3>Result</h3>
<pre id="result">Waiting...</pre>

<script>
/**
 * Braspag SOP 返回的数据会写入 iframe
 * 我们监听 iframe 的 load 事件读取返回内容
 */
const iframe = document.querySelector('iframe');
iframe.addEventListener('load', function () {
    try {
        const body = iframe.contentDocument.body.innerText;
        document.getElementById('result').innerText = body;
    } catch (e) {
        document.getElementById('result').innerText =
            'Response received, but cannot be read due to cross-domain restrictions.\n\n' +
            'This is expected. Check Braspag dashboard or backend logs.';
    }
});
</script>

</body>
</html>
